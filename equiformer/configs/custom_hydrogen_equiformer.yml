trainer: energy_v2

dataset:
  - src: datasets/custom_hydrogen_ocp/train.lmdb
    normalize_labels: True
    target_mean: -0.2042156457901001
    target_std: 0.6712170839309692
  - src: datasets/custom_hydrogen_ocp/val.lmdb

logger: tensorboard

task:
  dataset: single_point_lmdb_v2
  description: "Regressing to hydrogen adsorption energies"
  type: regression
  metric: mae
  labels:
    - energy

hide_eval_progressbar: False

model:
  name: equiformer_v2_oc20
  
  use_pbc: False                    # 氢吸附系统通常不需要周期性边界条件
  regress_forces: False             # 只预测能量，不预测力
  otf_graph: True
  max_neighbors: 20
  max_radius: 12.0
  max_num_elements: 90

  num_layers: 8                     # 稍微减少层数以适应较小的数据集
  sphere_channels: 128
  attn_hidden_channels: 64
  num_heads: 8
  attn_alpha_channels: 64
  attn_value_channels: 16
  ffn_hidden_channels: 128
  norm_type: 'layer_norm_sh'

  lmax_list: [4]                    # 减少以适应问题复杂度
  mmax_list: [2]
  grid_resolution: 18

  num_sphere_samples: 128

  edge_channels: 128
  use_atom_edge_embedding: True
  share_atom_edge_embedding: False
  distance_function: 'gaussian'
  num_distance_basis: 512

  attn_activation: 'silu'
  use_s2_act_attn: False
  use_attn_renorm: True
  ffn_activation: 'silu'
  use_gate_act: False
  use_grid_mlp: True
  use_sep_s2_act: True

  alpha_drop: 0.1
  drop_path_rate: 0.05
  proj_drop: 0.0

  weight_init: 'uniform'

optim:
  batch_size: 8                     # 增加批次大小
  eval_batch_size: 8
  grad_accumulation_steps: 1
  load_balancing: atoms
  num_workers: 4
  lr_initial: 0.0005                # 稍微提高学习率
  
  optimizer: AdamW
  optimizer_params:
    weight_decay: 0.001
  scheduler: LambdaLR
  scheduler_params:
    lambda_type: cosine
    warmup_factor: 0.2
    warmup_epochs: 5                # 适当的warmup
    lr_min_factor: 0.01

  max_epochs: 100                   # 增加训练轮数
  energy_coefficient: 1             # 只有能量损失
  clip_grad_norm: 100
  ema_decay: 0.999
  loss_energy: mae

  eval_every: 500                   # 更频繁的评估 